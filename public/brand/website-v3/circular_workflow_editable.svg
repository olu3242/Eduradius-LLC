<svg role="img" aria-labelledby="title desc" xmlns="http://www.w3.org/2000/svg" width="800" height="800" viewBox="0 0 800 800">
<title id="title">EduRadius proposed client engagement lifecycle</title><desc id="desc">Discover, Assess, Design, Implement, Measure, and Optimize. Scope and milestones are agreed during intake.</desc><rect width="800" height="800" fill="#F8F8F2"/>
<style>text{font-family:Arial,Helvetica,sans-serif}.num{font-size:20px;font-weight:bold;fill:white}.lab{font-size:21px;font-weight:bold;fill:white}.desc{font-size:13px;fill:white}.center{fill:#173F35}</style>
