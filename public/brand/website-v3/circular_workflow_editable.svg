<text x="647.0" y="405.0" text-anchor="middle" class="lab">Assess</text>
<text x="647.0" y="426.0" text-anchor="middle" class="desc">Review readiness and</text>
<text x="647.0" y="442.0" text-anchor="middle" class="desc">risks</text>
<path d="M 550.8 492.7 L 672.6 567.7 A 320 320 0 0 1 408.9 719.9 L 404.9 576.9 A 177 177 0 0 0 550.8 492.7 Z" fill="#30604F"/>
