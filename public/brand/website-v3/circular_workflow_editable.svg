<text x="523.5" y="618.9" text-anchor="middle" class="lab">Design</text>
<text x="523.5" y="639.9" text-anchor="middle" class="desc">Shape the right</text>
<text x="523.5" y="655.9" text-anchor="middle" class="desc">solution</text>
<path d="M 395.1 576.9 L 391.1 719.9 A 320 320 0 0 1 127.4 567.7 L 249.2 492.7 A 177 177 0 0 0 395.1 576.9 Z" fill="#173F35"/>
