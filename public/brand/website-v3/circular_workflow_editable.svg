<text x="153.0" y="405.0" text-anchor="middle" class="lab">Measure</text>
<text x="153.0" y="426.0" text-anchor="middle" class="desc">Track outcomes and</text>
<text x="153.0" y="442.0" text-anchor="middle" class="desc">impact</text>
<path d="M 249.2 307.3 L 127.4 232.3 A 320 320 0 0 1 391.1 80.1 L 395.1 223.1 A 177 177 0 0 0 249.2 307.3 Z" fill="#173F35"/>
<text x="276.5" y="164.1" text-anchor="middle" class="num">06</text>
<text x="276.5" y="191.1" text-anchor="middle" class="lab">Optimize</text>
<text x="276.5" y="212.1" text-anchor="middle" class="desc">Improve continuously</text>
