<text x="276.5" y="618.9" text-anchor="middle" class="lab">Implement</text>
<text x="276.5" y="639.9" text-anchor="middle" class="desc">Deploy and enable</text>
<text x="276.5" y="655.9" text-anchor="middle" class="desc">teams</text>
<path d="M 244.3 484.2 L 118.5 552.2 A 320 320 0 0 1 118.5 247.8 L 244.3 315.8 A 177 177 0 0 0 244.3 484.2 Z" fill="#245345"/>
