<text x="523.5" y="191.1" text-anchor="middle" class="lab">Discover</text>
<text x="523.5" y="212.1" text-anchor="middle" class="desc">Understand goals and</text>
<text x="523.5" y="228.1" text-anchor="middle" class="desc">needs</text>
